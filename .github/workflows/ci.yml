name: CI

# Runs on every push to every branch, and on every pull request.
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

# A newer push to the same ref makes the older run pointless, so cancel it.
# This keeps the queue short without ever cancelling a release build, which
# lives in release.yml.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      # Static analysis. Any error or warning fails the job: this is the
      # fail-fast gate for the rest of the pipeline.
      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded
