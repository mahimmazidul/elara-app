name: Device screenshots

# Screenshots captured from the **installed APK on an emulator**, not from a
# headless widget tree.
#
# The milestone requires the pictures in the repository to be real renders of
# the compiled app. A widget-tree render is a real render of the app's
# widgets, but it is not the compiled app: it has no Android system bars, no
# status bar, no navigation gesture area, and it cannot catch a layout that
# only breaks because of the platform's own insets. This workflow installs the
# debug artifact on an emulator, drives it through the screens, and commits
# what the emulator's screencap actually produced.
#
# The two sets are kept apart on purpose:
#
#   docs/screenshots/       - the widget-tree renders, used for the README and
#                              the landing page. Fast, deterministic, and
#                              regenerated by screenshots.yml on every change.
#   docs/device-screenshots/ - the emulator renders, used as evidence that the
#                              compiled app looks the way the widget tree says
#                              it does. Includes the system bars.
#
# Nothing here is edited. Whatever the emulator produced is what is committed.

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'tool/android_ui/**'
      - '.github/workflows/device-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: device-screenshots
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9
  JAVA_VERSION: '21'

jobs:
  capture:
    name: Capture from the installed APK
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # The Gradle cache, for the same reason as in android-ci.yml: the
      # dependency graph does not change between runs, and re-downloading it
      # is the largest repetition in a job that builds an APK.
      - name: Cache the Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/**', 'android/app/build.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build the debug APK
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "::group::assembleDebug attempt ${attempt}"
            # The captures below use `adb exec-out screencap`, which a window
            # protected by FLAG_SECURE returns as black. This is the one build
            # that is allowed to be captured, and it says so explicitly.
            if flutter build apk --debug \
                --android-project-arg=elaraScreenshots=true \
                --target-platform android-arm64,android-arm,android-x64; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "${attempt}" = 3 ]; then
              echo "::error::The APK build failed on all three attempts."
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Enable the KVM device the emulator needs
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Drive the app on the emulator and capture it
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot
          # The capture script installs the artifact itself and drives the
          # app through its screens, taking a screencap of each.
          script: tool/android_ui/capture_screens.sh

      - name: Upload the raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-screenshots-raw
          path: evidence
          retention-days: 14
          if-no-files-found: warn

      - name: Copy the captures into docs/device-screenshots
        run: |
          set -euo pipefail
          mkdir -p docs/device-screenshots
          # Only the numbered captures are committed; the dumps beside them
          # (logcat, uiautomator, window geometry) are evidence and belong in
          # the artifact, not in the repository.
          count=0
          for png in evidence/[0-9]*.png; do
            [ -e "$png" ] || continue
            name="$(basename "$png")"
            cp "$png" "docs/device-screenshots/$name"
            count=$((count + 1))
          done
          echo "Copied ${count} capture(s)."
          if [ "$count" -eq 0 ]; then
            echo "::error::The emulator produced no captures. The app may not have started."
            exit 1
          fi

          # A capture that this run did not produce is stale, and a stale
          # capture is worse than a missing one: it looks like evidence for
          # a screen that has since been renamed or removed. The numbered
          # captures are removed first, and only the ones this run actually
          # produced are put back.
          echo "Removing captures this run did not produce."
          for old_png in docs/device-screenshots/[0-9]*.png; do
            [ -e "$old_png" ] || continue
            name="$(basename "$old_png")"
            if [ ! -e "evidence/$name" ]; then
              echo "  removing stale $name"
              rm -f "$old_png"
            fi
          done

          ls -la docs/device-screenshots

      - name: Commit anything that changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain docs/device-screenshots)" ]; then
            echo "The device captures are unchanged; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/device-screenshots
          git commit -m "chore: refresh the device screenshots [skip ci]"

          # A commit that lands on the remote between this workflow's
          # checkout and its push makes the push a non-fast-forward. That is
          # a race, not a conflict about the screenshots: the captures are in
          # a directory nobody else writes to. So the push is retried against
          # the new head rather than being reported as a failure.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Committed refreshed device screenshots."
              exit 0
            fi
            echo "::notice::The push was rejected (attempt ${attempt}); rebasing onto the remote head."
            git pull --rebase origin main || git rebase FETCH_HEAD || true
            sleep $((attempt * 5))
          done

          echo "::error::Could not push the refreshed device screenshots after five attempts."
          exit 1
