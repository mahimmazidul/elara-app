name: Release

# Only version tags. CI (ci.yml) covers ordinary pushes and pull requests.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish signed artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      # Needed to create the GitHub Release and upload its assets.
      contents: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      apk_url: ${{ steps.publish.outputs.apk_url }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history so release notes can be generated from the commits
          # since the previous tag.
          fetch-depth: 0

      # The tag glob 'v*.*.*' also matches things like v1.0.0-rc.1, so the shape
      # is checked explicitly here. Everything downstream then knows the tag is
      # a plain vX.Y.Z.
      - name: Validate the tag is vMAJOR.MINOR.PATCH
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$tag' is not a plain version tag (expected vX.Y.Z)."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag is $tag"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Both gates run before any signing material is written to disk, so a
      # broken build never leaves a keystore on the runner.
      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      # The keystore exists only inside this job: decoded from a secret into a
      # gitignored path, used to sign, and never uploaded.
      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/elara-release.jks
          test -s android/app/elara-release.jks || {
            echo "::error::Decoded keystore is empty."
            exit 1
          }
          echo "Keystore decoded ($(wc -c < android/app/elara-release.jks) bytes)"

      - name: Write android/key.properties
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::KEY_ALIAS, KEY_PASSWORD and STORE_PASSWORD must all be set."
            exit 1
          fi
          cat > android/key.properties <<EOF
          storeFile=elara-release.jks
          keyAlias=${KEY_ALIAS}
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          EOF
          echo "key.properties written"

      # If signing silently fell back to the debug key the artifacts would be
      # unusable for distribution, so this asserts the release key is present.
      - name: Verify the signing configuration is wired
        run: |
          grep -q 'signingConfigs.getByName("release")' android/app/build.gradle.kts \
            || { echo "::error::Release signing config is not referenced by the release build type."; exit 1; }
          echo "Release signing config is wired"

      - name: Build app bundle (release)
        run: flutter build appbundle --release

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Confirm the APK is signed with the release key
        run: |
          apksigner=$(find "$ANDROID_HOME" -name apksigner -type f | sort | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::warning::apksigner not found; skipping signature verification."
            exit 0
          fi
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -5

      - name: Publish the GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # --generate-notes builds the body from commits since the previous tag.
          gh release create "$VERSION" \
            --title "Elara $VERSION" \
            --generate-notes \
            build/app/outputs/bundle/release/app-release.aab \
            build/app/outputs/flutter-apk/app-release.apk

          apk_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${VERSION}/app-release.apk"
          echo "apk_url=${apk_url}" >> "$GITHUB_OUTPUT"
          echo "Published ${apk_url}"

  pages:
    name: Deploy the landing page
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    # The page lives in one place (pages.yml), so the tag-triggered path and the
    # docs-triggered path cannot drift apart. The version and APK link come
    # straight from the build job rather than being re-derived.
    uses: ./.github/workflows/pages.yml
    with:
      version: ${{ needs.build.outputs.version }}
      download_url: ${{ needs.build.outputs.apk_url }}
